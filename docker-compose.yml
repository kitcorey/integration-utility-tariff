services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-stable}
    container_name: integration-utility-tariff-dev
    restart: unless-stopped
    volumes:
      - ./config:/config
      - ./custom_components/utility_tariff:/config/custom_components/utility_tariff
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${HA_PORT:-8123}:8123"
